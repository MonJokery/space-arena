name: Build and publish Docker image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Deploy specific tag to image-backed Render service
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent -X POST --get --data-urlencode "imgURL=$IMAGE" "$RENDER_DEPLOY_HOOK"
          else
            echo 'No RENDER_DEPLOY_HOOK; GHCR image published only.'
          fi
